<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#1f2328; --sub:#6b7280; --line:#e5e7eb;
  --pri:#2563eb; --pri-text:#ffffff; --over:#dc2626; --over-bg:#fef2f2;
  --today:#d97706; --ok:#16a34a; --muted:#9ca3af; --warn-bg:#fff7ed; --warn-line:#fdba74;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111418; --card:#1c2128; --text:#e6e8eb; --sub:#9aa4b2; --line:#2d333b;
    --pri:#3b82f6; --pri-text:#ffffff; --over:#f87171; --over-bg:#2a1618;
    --today:#fbbf24; --ok:#4ade80; --muted:#6b7280; --warn-bg:#2a1f12; --warn-line:#9a5b13;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  overscroll-behavior:none;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
header{padding:16px 16px 4px;display:flex;align-items:baseline;gap:10px}
header h1{font-size:20px;margin:0}
header #date{color:var(--sub);font-size:14px}
#busy{margin-left:auto;font-size:12px;color:var(--sub)}
main{padding:0 16px 120px;max-width:640px;margin:0 auto}
h2{font-size:15px;margin:20px 0 8px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card.warn{background:var(--warn-bg);border-color:var(--warn-line);cursor:pointer}
.card.top{border-width:2px;border-color:var(--pri)}
.row1{display:flex;gap:10px;align-items:flex-start}
.rank{flex:none;width:26px;height:26px;border-radius:50%;background:var(--pri);color:var(--pri-text);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.lbl{font-weight:700;font-size:16px}
.cn{color:var(--pri);font-size:14px;margin-top:2px;cursor:pointer}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--sub);margin-top:8px}
.due{font-weight:700;color:var(--text)}
.due.over{color:var(--over)} .due.today{color:var(--today)}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;
  padding:9px 14px;font-size:15px;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-text);font-weight:700}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--over)}
.empty{color:var(--sub);text-align:center;padding:24px 0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok)}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--over-bg);color:var(--over);margin-left:6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;color:var(--sub);font-size:15px;padding:14px 0;cursor:pointer}
nav.tabs button.on{color:var(--pri);font-weight:700}
#fab{position:fixed;right:20px;bottom:calc(72px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;
  border:0;background:var(--pri);color:var(--pri-text);font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer}
#sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:flex;align-items:flex-end;justify-content:center}
#sheet-wrap[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;
  padding:16px 16px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sheet-head h3{margin:0;font-size:18px;flex:1}
.x{border:0;background:none;font-size:24px;color:var(--sub);cursor:pointer;padding:4px 8px}
label.f{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);color:var(--text);font-family:inherit}
textarea{min-height:60px}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px}
.chk input{width:20px;height:20px}
.step{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.step .name{font-weight:700}
.step.done .name,.step.skipped .name{color:var(--muted);text-decoration:line-through}
.step.blocked{opacity:.6}
.step .info{font-size:13px;color:var(--sub);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step .info input[type=date]{width:auto;padding:4px 6px;font-size:14px}
.tag{font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--sub)}
.link{background:none;border:0;color:var(--pri);font-size:13px;cursor:pointer;padding:0}
.link.danger{color:var(--over)}
.tag.cap{border-color:var(--today);color:var(--today)}
.tag.add{border-color:var(--pri);color:var(--pri)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));
  background:#111827;color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;display:flex;gap:14px;align-items:center;z-index:20;
  max-width:calc(100% - 32px)}
#toast[hidden]{display:none}
.cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--over);
  color:#fff;font-size:12px;line-height:18px;font-weight:700}
.cnt[hidden]{display:none}
.memo-in{display:flex;gap:8px}
.memo-in input{flex:1;min-width:0}
.memo{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.memo:first-child{border-top:0}
.memo .tx{flex:1;min-width:0;word-break:break-all}
.memo small{color:var(--sub);font-size:12px;white-space:nowrap}
.call.done{opacity:.6}
a.btn{text-decoration:none;display:inline-block}
.sum .sum-row{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0}
.sum .sum-row span{color:var(--sub);font-size:14px}
.sum .sum-row b{font-size:18px;font-variant-numeric:tabular-nums}
.sum .plus{color:var(--ok)} .sum .minus{color:var(--over)}
.btn.tm{font-variant-numeric:tabular-nums}
.btn.tm.run{background:var(--today);border-color:var(--today);color:#fff;font-weight:700}
.choice{display:flex;flex-direction:column;gap:8px}
.choice .btn{text-align:left;padding:12px 14px}
.choice .btn small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.choice.grid{display:grid;grid-template-columns:repeat(2,1fr)}
.choice.grid .btn{text-align:center}
.memo-q{white-space:pre-wrap;word-break:break-all}
#toast button{background:none;border:0;color:#93c5fd;font-weight:700;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<header><h1>今日やる</h1><span id="date"></span><span id="busy"></span></header>
<main>
  <section id="tab-today">
    <div id="day-summary"></div>
    <div class="card">
      <div class="memo-in"><input type="text" id="m-text" placeholder="メモ（電話で聞いたことなどを1行で）" enterkeyhint="done">
        <button class="btn pri" id="m-add">追加</button></div>
      <div id="memo-list"></div>
    </div>
    <div id="today-list"><p class="empty">読み込み中…</p></div>
  </section>
  <section id="tab-cases" hidden>
    <div id="cases-list"></div>
  </section>
  <section id="tab-closed" hidden></section>
  <section id="tab-calls" hidden>
    <h2>受電を記録</h2>
    <div class="card">
      <label class="f">相手</label><input type="text" id="c-who" placeholder="例：〇〇不動産 田中さん">
      <label class="f">電話番号</label><input type="tel" id="c-tel" inputmode="tel">
      <label class="f">用件</label><input type="text" id="c-what">
      <label class="chk"><input type="checkbox" id="c-need" checked>折り返しが必要</label>
      <div class="btns"><button class="btn pri" id="c-add">登録</button></div>
    </div>
    <div id="calls-list"></div>
  </section>
</main>
<button id="fab" aria-label="案件を追加">＋</button>
<nav class="tabs">
  <button data-tab="today" class="on">今日</button>
  <button data-tab="cases">案件</button>
  <button data-tab="closed">完了</button>
  <button data-tab="calls">受電<span class="cnt" id="call-badge" hidden></span></button>
</nav>
<div id="sheet-wrap" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast" hidden></div>

<script>
const CLIENT_VERSION = '2026-10-20'; // Code.gs の APP_VERSION と同じにする
let DATA = null;
let OPEN_CASE = null;
let CLOSED = null;   // 完了した案件（完了タブを開いた時だけ読む）
let PENDING = 0;     // 裏で保存中の件数
const findCase = id => (DATA && DATA.cases.find(x => x.id === id)) || (CLOSED || []).find(x => x.id === id);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- 画面左端からのスワイプで「戻る」が起きないようにする（全アプリ共通ルール） ---- */
document.addEventListener('touchstart', e => {
  const x = e.touches[0].clientX;
  if (x < 20 || x > window.innerWidth - 20) e.preventDefault();
}, { passive: false });
try {
  google.script.history.push({ s: 1 }, '', '');
  google.script.history.setChangeHandler(() => {
    if (!$('#sheet-wrap').hidden) closeSheet();
    google.script.history.push({ s: 1 }, '', '');
  });
} catch (e) {}

/* ---- サーバー呼び出し ---- */
function call(fn, ...args) {
  return new Promise((res, rej) => {
    // サーバーからは文字にしたデータが届くので、元の形に戻す
    const ok = r => {
      if (typeof r === 'string' && /^[\[{]/.test(r)) {
        try { r = JSON.parse(r); } catch (e) { rej(new Error('データを読み取れませんでした')); return; }
      }
      if (r === null || r === undefined) { rej(new Error('サーバーから空のデータが返りました')); return; }
      res(r);
    };
    google.script.run.withSuccessHandler(ok).withFailureHandler(rej)[fn](...args);
  });
}
function busy(on) { $('#busy').textContent = on ? '保存中…' : ''; }
// Code.gs が古いと「関数が見つからない」エラーになるので、分かりやすい言葉に置き換える
const errText = e => {
  const m = String((e && e.message) || e);
  return /Script function not found|関数が見つかりません|is not defined/i.test(m)
    ? 'Code.gs が古い版のようです。Code.gs を最新版に貼り替えて、「新バージョン」でデプロイしてください。（' + m + '）'
    : m;
};
async function load() {
  try { DATA = await call('getData'); render(); }
  catch (e) { $('#today-list').innerHTML = '<p class="empty">読み込みエラー：' + esc(errText(e)) + '</p>'; }
}
async function act(fn, args, toastInfo) {
  busy(true);
  try {
    DATA = await call(fn, ...args);
    render();
    if (toastInfo) toast(toastInfo.msg, toastInfo.undo);
  } catch (e) { alert('エラー：' + errText(e)); }
  busy(PENDING > 0);
}

/* ---- 押した瞬間に画面を変え、保存は裏で行う ---- */
function applyLocal(caseId, key, action, date) {
  const c = DATA.cases.find(x => x.id === caseId);
  const s = c && c.steps.find(x => x.key === key);
  if (s && (action === 'done' || action === 'skip')) {
    s.state = action === 'done' ? 'done' : 'skipped';
    s.doneDate = date || DATA.today;
  } else if (s && action === 'nudge') {
    s.lastNudge = DATA.today;
  }
  if (action !== 'undo') DATA.items = DATA.items.filter(it => !(it.caseId === caseId && it.key === key));
  if (action === 'done' || action === 'skip' || action === 'nudge') {
    if (DATA.timers) delete DATA.timers[caseId ? caseId + '|' + key : 'S|' + key];
  }
}
async function actFast(args, toastInfo) {
  applyLocal(...args);
  render();
  if (toastInfo) toast(toastInfo.msg, toastInfo.undo);
  PENDING++;
  busy(true);
  try {
    const d = await call('taskAction', ...args);
    PENDING--;
    if (PENDING === 0) { DATA = d; render(); }  // 連続で押した時は、最後の保存が済んでから反映
  } catch (e) {
    PENDING--;
    alert('保存できませんでした：' + errText(e) + '\n最新の状態を読み込み直します');
    await load();
  }
  busy(PENDING > 0);
}
// メモ・受電用：押した瞬間に画面を変え、保存は裏で行う
async function actQuick(fn, args, localFn, toastMsg) {
  if (localFn) { localFn(); render(); }
  if (toastMsg) toast(toastMsg);
  PENDING++;
  busy(true);
  try {
    const d = await call(fn, ...args);
    PENDING--;
    if (PENDING === 0) { DATA = d; render(); }
  } catch (e) {
    PENDING--;
    alert('保存できませんでした：' + errText(e) + '\n最新の状態を読み込み直します');
    await load();
  }
  busy(PENDING > 0);
}
async function loadClosed() {
  try { CLOSED = await call('getClosedData'); }
  catch (e) { CLOSED = []; alert('完了案件の読み込みエラー：' + e.message); }
  renderClosed();
}
async function changeStatus(id, closed, msg) {
  await act('setCaseStatus', [id, closed], { msg: msg });
  CLOSED = null;
  if (!$('#tab-closed').hidden) loadClosed();
}

/* ---- 日付表示 ---- */
function md(s) {
  if (!s) return '';
  const p = s.split('-').map(Number);
  const w = '日月火水木金土'[new Date(p[0], p[1] - 1, p[2]).getDay()];
  return p[1] + '/' + p[2] + '(' + w + ')';
}
function dt(s) {  // 'yyyy-MM-dd HH:mm:ss' → '10/16(金) 8:32'
  if (!s) return '';
  const t = String(s).split(' ');
  const hm = (t[1] || '').split(':');
  return md(t[0]) + (hm.length > 1 ? ' ' + Number(hm[0]) + ':' + hm[1] : '');
}
function remainText(r) { return r < 0 ? (-r) + '日超過' : r === 0 ? '今日' : 'あと' + r + '日'; }
function daysBetween(a, b) {
  const pa = a.split('-').map(Number), pb = b.split('-').map(Number);
  return Math.round((Date.UTC(pa[0], pa[1] - 1, pa[2]) - Date.UTC(pb[0], pb[1] - 1, pb[2])) / 86400000);
}

/* ---- 描画 ---- */
function render() {
  $('#date').textContent = md(DATA.today);
  renderToday(); renderCases(); renderClosed(); renderMemos(); renderCalls();
  if (OPEN_CASE) renderCaseSteps();
}

function renderToday() {
  const warns = [];
  DATA.cases.filter(c => c.status === '進行中').forEach(c => c.warnings.forEach(w => warns.push({ c, w })));
  let h = '';
  if (warns.length) {
    h += '<h2>⚠️ 警告</h2>' + warns.map(x =>
      `<div class="card warn" data-open="${x.c.id}"><b>${esc(x.c.name)}</b><div>${esc(x.w)}</div></div>`).join('');
  }
  const top = DATA.items.filter(it => it.today), rest = DATA.items.filter(it => !it.today);
  h += '<h2>今日やる（' + top.length + '件）</h2>';
  h += top.length ? top.map((it, i) => itemCard(it, i + 1)).join('') : '<p class="empty">今やるべきタスクはありません 🎉</p>';
  if (rest.length) h += '<h2>そのほか（急ぐ順）</h2>' + rest.map(it => itemCard(it)).join('');
  $('#today-list').innerHTML = h;
  renderSummary();
}

/* ---- ストップウォッチ ---- */
const pad2 = n => ('0' + n).slice(-2);
function elapsedSec(target) {
  const t = (DATA.timers || {})[target];
  if (!t) return 0;
  return t.acc + (t.start ? Math.max(0, (Date.now() - t.start) / 1000) : 0);
}
function fmtClock(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? h + ':' + pad2(m) + ':' + pad2(s) : m + ':' + pad2(s);
}
function fmtHM(min) { min = Math.round(Math.abs(min)); return Math.floor(min / 60) + ':' + pad2(min % 60); }
function timerBtn(target, small) {
  const t = (DATA.timers || {})[target];
  const run = !!(t && t.start), sec = elapsedSec(target);
  return `<button class="btn ${small ? 'sm' : ''} tm ${run ? 'run' : ''}" data-timer="${target}">${run ? '⏸' : '▶'}
    <span data-tclock="${target}">${sec ? fmtClock(sec) : '計測'}</span></button>` +
    (!run && sec ? `<button class="link" data-treset="${target}">計測をやり直す</button>` : '');
}
function estText(o) {
  return '見積 ' + o.est + '分' + (o.estN ? '（過去' + o.estN + '回）' : '（仮）');
}
function toggleTimer(target) {
  const now = Date.now();
  const tm = DATA.timers || (DATA.timers = {});
  const cur = tm[target];
  if (cur && cur.start) {
    actQuick('timerAction', [target, 'pause', now], () => { cur.acc += (now - cur.start) / 1000; cur.start = 0; });
  } else {
    actQuick('timerAction', [target, 'start', now], () => {
      Object.keys(tm).forEach(k => { const v = tm[k]; if (v.start) { v.acc += (now - v.start) / 1000; v.start = 0; } });
      tm[target] = { acc: cur ? cur.acc : 0, start: now };
    });
  }
}
function resetTimer(target) {
  if (!confirm('このタスクの計測時間を0に戻しますか？')) return;
  actQuick('timerAction', [target, 'reset', Date.now()], () => { delete DATA.timers[target]; });
}

/* ---- 上部：今日の見積合計と、終業までの残り時間 ---- */
function renderSummary() {
  if (!DATA) return;
  if (DATA.version !== CLIENT_VERSION) {
    $('#day-summary').innerHTML = `<div class="card warn"><b>⚠ Code.gs と index.html の版が合っていません</b>
      <div>Code.gs：${esc(DATA.version || '古い版')}／index.html：${CLIENT_VERSION}。2つとも最新版に貼り替えて保存し、「デプロイを管理 → 新バージョン」でデプロイしてください。</div></div>`;
    return;
  }
  if (!DATA.config) return;
  const toMin = s => { const p = s.split(':'); return Number(p[0]) * 60 + Number(p[1]); };
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const st = toMin(DATA.config.dayStart), en = toMin(DATA.config.dayEnd);
  const avail = Math.max(0, en - Math.max(st, nowMin));
  const top = DATA.items.filter(it => it.today);
  let est = 0, noRec = 0;
  top.forEach(it => {
    est += Math.max(0, it.est - elapsedSec(it.target) / 60);
    if (!it.estN) noRec++;
  });
  const diff = avail - est;
  $('#day-summary').innerHTML = `<div class="card sum">
    <div class="sum-row"><span>今日やる分の見積（残り）</span><b>${fmtHM(est)}</b></div>
    <div class="sum-row"><span>${DATA.config.dayEnd}までの残り時間</span><b>${fmtHM(avail)}</b></div>
    <div class="sum-row"><span>差し引き</span><b class="${diff < 0 ? 'minus' : 'plus'}">${diff < 0 ? '−' : '＋'}${fmtHM(diff)}</b></div>
    ${noRec ? `<div class="meta">記録がまだ無い${noRec}件は、1件${DATA.config.defaultEst}分で計算しています</div>` : ''}
  </div>`;
}

// 1秒ごとに動いている時計だけ書き換える（画面全体は描き直さない）
let TICK = 0;
setInterval(() => {
  if (!DATA) return;
  document.querySelectorAll('[data-tclock]').forEach(el => {
    const t = (DATA.timers || {})[el.dataset.tclock];
    if (t && t.start) el.textContent = fmtClock(elapsedSec(el.dataset.tclock));
  });
  if (++TICK % 30 === 0) renderSummary();
}, 1000);

function itemCard(it, rank) {
  const cls = it.remain < 0 ? 'over' : it.remain === 0 ? 'today' : '';
  const pre = it.kind === 'wait' ? '催促日 ' : '期限 ';
  const a = `data-c="${it.caseId}" data-k="${it.key}"`;
  const btns = (it.kind === 'wait'
    ? `<button class="btn pri" data-act="done" ${a}>受領した</button><button class="btn" data-act="nudge" ${a}>催促した</button>`
    : `<button class="btn pri" data-act="done" ${a}>完了</button>`) +
    (it.single ? `<button class="btn" data-act="skip" ${a}>不要</button>` : '') + timerBtn(it.target);
  const sub = it.single
    ? `<div class="cn" style="cursor:default;color:var(--sub)">単発タスク</div>`
    : `<div class="cn" data-open="${it.caseId}">${esc(it.caseName)} ›</div>`;
  return `<div class="card ${rank ? 'top' : ''}">
    <div class="row1">${rank ? `<span class="rank">${rank}</span>` : ''}
      <div><div class="lbl">${esc(it.label)}</div>${sub}</div></div>

function stepRow(c, s) {
  if (c.status !== '進行中') {  // 完了した案件は見るだけ
    const tag = s.state === 'done' ? (s.kind === 'wait' ? '受領' : '完了') : s.state === 'skipped' ? '不要' : '未完了';
    return `<div class="step ${s.state}"><div class="name">${esc(s.label)}</div>
      <div class="info"><span class="tag">${tag}</span>${s.doneDate ? md(s.doneDate) : ''}</div></div>`;
  }
  const a = `data-c="${c.id}" data-k="${s.key}"`;
  let info = '', btns = '';
  if (s.state === 'done' || s.state === 'skipped') {
    info = `<span class="tag">${s.state === 'done' ? (s.kind === 'wait' ? '受領' : '完了') : '不要'}</span>
      <input type="date" value="${s.doneDate}" data-redate ${a}>
      <button class="link" data-act="undo" ${a}>取り消す</button>`;
  } else if (s.state === 'blocked') {
    info = esc(s.note);
  } else {
    const r = daysBetween(s.due, DATA.today);
    const cls = r < 0 ? 'over' : r === 0 ? 'today' : '';
    info = `<span class="due ${cls}">${s.kind === 'wait' ? '催促日' : '期限'} ${md(s.due)}（${remainText(r)}）</span>
      <input type="date" value="${s.due}" data-override ${a} title="日付を変える">
      ${s.overridden ? `<button class="link" data-act="override" ${a}>自動計算に戻す</button>` : ''}`;
    if (s.kind === 'wait' && s.lastNudge) info += `<span>前回催促 ${md(s.lastNudge)}</span>`;
    if (s.capped) info += `<span class="tag cap">決済日から逆算して前倒し</span>`;
    if (s.est) info += `<span>${estText(s)}</span>`;
    btns = s.kind === 'wait'
      ? `<button class="btn sm pri" data-act="done" ${a}>受領した</button><button class="btn sm" data-act="nudge" ${a}>催促した</button><button class="btn sm" data-act="skip" ${a}>不要</button>`
      : `<button class="btn sm pri" data-act="done" ${a}>完了</button><button class="btn sm" data-act="skip" ${a}>不要</button>`;
    if (s.target) btns += timerBtn(s.target, true);
  }
  if (s.state === 'blocked') btns = `<button class="btn sm" data-act="skip" ${a}>不要</button>`;
  const extra = [];
  if (s.insertable && s.state !== 'done' && s.state !== 'skipped' && c.status === '進行中') {
    extra.push(`<button class="link" data-insert="${s.key}" data-c="${c.id}">＋この前にタスクを挿入</button>`);
  }
  if (s.custom) extra.push(`<button class="link danger" data-delcustom="${s.key}" data-c="${c.id}">このタスクを削除</button>`);
  return `<div class="step ${s.state}"><div class="name">${esc(s.label)}${s.custom ? ' <span class="tag add">追加</span>' : ''}</div>
    <div class="info">${info}</div>${btns ? `<div class="btns">${btns}</div>` : ''}
    ${extra.length ? `<div class="info" style="margin-top:8px">${extra.join('')}</div>` : ''}</div>`;
}

/* ---- 操作 ---- */
// 作業記録用：そのタスクの「種類キー」と名前
function metaOf(c, k) {
  if (!c) {
    const it = DATA.items.find(i => i.single && i.key === k);
    return it ? { simKey: it.simKey, name: it.label } : {};
  }
  const cs = findCase(c), s = cs && cs.steps.find(x => x.key === k);
  return s ? { simKey: s.simKey, name: s.label } : {};
}
function doTask(c, k, a, date) {
  let info = null;
  if (a === 'done' || a === 'skip') {
    info = { msg: a === 'done' ? '済みにしました' : '不要にしました', undo: () => actFast([c, k, 'undo', '']) };
  } else if (a === 'nudge') {
    info = { msg: '催促を記録しました。届かなければまた催促日に出てきます' };
  }
  if (a === 'override') act('taskAction', [c, k, a, date || ''], info);
  else actFast([c, k, a, date || '', metaOf(c, k)], info);
}

document.addEventListener('click', e => {
  const t = e.target;
  const tab = t.closest('nav.tabs button');
  if (tab) {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b === tab));
    ['today', 'cases', 'closed', 'calls'].forEach(n => { $('#tab-' + n).hidden = n !== tab.dataset.tab; });
    window.scrollTo(0, 0);
    if (tab.dataset.tab === 'closed' && CLOSED === null) loadClosed();
    return;
  }
  const actBtn = t.closest('[data-act]');
  if (actBtn) { doTask(actBtn.dataset.c, actBtn.dataset.k, actBtn.dataset.act, ''); return; }
  if (t.id === 'm-add') { addMemoNow(); return; }
  const mDel = t.closest('[data-memo-del]');
  if (mDel) {
    const id = mDel.dataset.memoDel;
    if (!$('#sheet-wrap').hidden) closeSheet();
    actQuick('deleteMemo', [id], () => { DATA.memos = DATA.memos.filter(m => m.id !== id); }, 'メモを消しました');
    return;
  }
  const mOpen = t.closest('[data-memo-open]');
  if (mOpen) { openMemo(mOpen.dataset.memoOpen); return; }
  const mNew = t.closest('[data-mnew]');
  if (mNew) { const m = memoById(mNew.dataset.mnew); if (m) openNew({ memoId: m.id, text: m.text }); return; }
  const mCaseSel = t.closest('[data-mcase]');
  if (mCaseSel) { openPickCase(mCaseSel.dataset.mcase); return; }
  const pickC = t.closest('[data-pickcase]');
  if (pickC) { openPickPos(pickC.dataset.pickcase, pickC.dataset.memo); return; }
  const pickP = t.closest('[data-pickpos]');
  if (pickP) {
    const m = memoById(pickP.dataset.memo);
    openInsert(pickP.dataset.c, pickP.dataset.pickpos, { memoId: pickP.dataset.memo, text: m ? m.text : '' });
    return;
  }
  const pickF = t.closest('[data-pickfixed]');
  if (pickF) {
    const m = memoById(pickF.dataset.memo);
    openAddFixed(pickF.dataset.pickfixed, { memoId: pickF.dataset.memo, text: m ? m.text : '' });
    return;
  }
  const mSingle = t.closest('[data-msingle]');
  if (mSingle) { openSingleType(mSingle.dataset.msingle); return; }
  const sType = t.closest('[data-stype]');
  if (sType) { openSingleForm(sType.dataset.stype, sType.dataset.memo); return; }
  if (t.id === 's-save') {
    const f = { type: t.dataset.type, text: $('#s-text').value, due: $('#s-due').value, memoId: t.dataset.memo };
    if (!f.text.trim()) { alert('内容を入れてください'); return; }
    closeSheet();
    act('addSingle', [f], { msg: '単発タスクを登録しました' });
    return;
  }
  const tmBtn = t.closest('[data-timer]');
  if (tmBtn) { toggleTimer(tmBtn.dataset.timer); return; }
  const tmReset = t.closest('[data-treset]');
  if (tmReset) { resetTimer(tmReset.dataset.treset); return; }
  if (t.id === 'c-add') { addCallNow(); return; }
  const cDone = t.closest('[data-call-done]');
  if (cDone) { const id = cDone.dataset.callDone; actQuick('setCallDone', [id, true], () => moveCallLocal(id, true), '折り返し済みにしました'); return; }
  const cRe = t.closest('[data-call-reopen]');
  if (cRe) { const id = cRe.dataset.callReopen; actQuick('setCallDone', [id, false], () => moveCallLocal(id, false), '未了に戻しました'); return; }
  const cDel = t.closest('[data-call-del]');
  if (cDel) {
    const id = cDel.dataset.callDel;
    if (confirm('この受電の記録を削除しますか？')) {
      actQuick('deleteCall', [id], () => {
        DATA.callsOpen = DATA.callsOpen.filter(x => x.id !== id);
        DATA.callsDone = DATA.callsDone.filter(x => x.id !== id);
      }, '削除しました');
    }
    return;
  }
  const ins = t.closest('[data-insert]');
  if (ins) { openInsert(ins.dataset.c, ins.dataset.insert); return; }
  const del = t.closest('[data-delcustom]');
  if (del) {
    if (confirm('このタスクを削除しますか？')) act('deleteCustomTask', [del.dataset.c, del.dataset.delcustom], { msg: '削除しました' });
    return;
  }
  const addf = t.closest('[data-addfixed]');
  if (addf) { openAddFixed(addf.dataset.addfixed); return; }
  const back = t.closest('[data-back]');
  if (back) { openCase(back.dataset.back); return; }
  if (t.id === 'i-quick') {
    addCustom({ caseId: t.dataset.c, before: t.dataset.before, label: t.dataset.label, kind: 'wait', days: 2, gap: 1, memoId: t.dataset.memo || '' });
    return;
  }
  if (t.id === 'i-save') {
    const f = { caseId: t.dataset.c, before: t.dataset.before, label: $('#i-label').value, kind: $('#i-kind').value,
      days: $('#i-days').value, gap: $('#i-gap').value, memoId: t.dataset.memo || '' };
    if (!f.label.trim()) { alert('タスク名を入れてください'); return; }
    addCustom(f);
    return;
  }
  if (t.id === 'a-save') {
    const f = { caseId: t.dataset.c, before: '', label: $('#a-label').value, kind: $('#a-kind').value, date: $('#a-date').value, memoId: t.dataset.memo || '' };
    if (!f.label.trim()) { alert('タスク名を入れてください'); return; }
    if (!f.date) { alert('期日を入れてください'); return; }
    addCustom(f);
    return;
  }
  const open = t.closest('[data-open]');
  if (open) { openCase(open.dataset.open); return; }
  if (t.closest('[data-close]') || t.id === 'sheet-wrap') { closeSheet(); return; }
  if (t.id === 'fab') { if (!DATA) { alert('まだ読み込み中です。少し待つか、画面上の表示を確認してください'); return; } openNew(); return; }
  if (t.id === 'n-save') {
    const f = {
      name: $('#n-name').value, requestDate: $('#n-req').value, settleDate: $('#n-settle').value,
      unreg: $('#n-unreg').value, memo: $('#n-memo').value,
      evalReceived: $('#n-eval').checked, buyerReceived: $('#n-buyer').checked,
      memoId: t.dataset.memo || ''
    };
    if (!f.name.trim()) { alert('案件名を入れてください'); return; }
    closeSheet();
    act('addCase', [f], { msg: '登録しました' });
    return;
  }
  const save = t.closest('[data-save]');
  if (save) {
    act('updateCase', [{
      id: save.dataset.save, name: $('#e-name').value, requestDate: $('#e-req').value,
      settleDate: $('#e-settle').value, unreg: $('#e-unreg').value, memo: $('#e-memo').value
    }], { msg: '保存しました' });
    return;
  }
  const cc = t.closest('[data-close-case]');
  if (cc) {
    if (confirm('この案件を完了にしますか？')) { closeSheet(); changeStatus(cc.dataset.closeCase, true, '案件を完了にしました'); }
    return;
  }
  const ro = t.closest('[data-reopen]');
  if (ro) { closeSheet(); changeStatus(ro.dataset.reopen, false, '進行中に戻しました'); }
});

// メモ欄でEnterを押したら追加（日本語の変換確定のEnterでは追加しない）
document.addEventListener('keydown', e => {
  if (e.target.id === 'm-text' && e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault();
    addMemoNow();
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'i-kind') {
    $('#i-days-l').textContent = t.value === 'wait' ? '何日返事がなければ催促するか' : '期限：前のタスクが済んでから何日';
    return;
  }
  if (t.matches('[data-redate]') && t.value) doTask(t.dataset.c, t.dataset.k, 'done', t.value);
  else if (t.matches('[data-override]') && t.value) doTask(t.dataset.c, t.dataset.k, 'override', t.value);
});

load();

// 着信履歴から共有された番号（URLの #tel=… ）を受け取ったら、受電タブを番号入りで開く
try {
  google.script.url.getLocation(loc => {
    // 受け取り方：URLの「?tel=」「?memo=」（念のため、以前の「#tel=」形式も読む）
    const param = (loc && loc.parameter) || {};
    const hash = String((loc && loc.hash) || '');
    const get = k => {
      if (param[k]) return String(param[k]);
      const m = hash.match(new RegExp('(?:^|&)' + k + '=([^&]*)'));
      try { return m ? decodeURIComponent(m[1]) : ''; } catch (e) { return ''; }
    };
    if (param.tel || param.memo || hash) {
      try { google.script.history.replace(null, {}, ''); } catch (e) {}  // 受け取った内容をアドレス欄から消す
    }
    // LINEなどの文章 → 今日タブのメモ欄に入れるだけ（「追加」を押すまで保存しない）
    const memo = get('memo').replace(/[\r\n]+/g, ' ').trim().slice(0, 1000);
    if (memo) {
      $('nav.tabs button[data-tab="today"]').click();
      $('#m-text').value = memo;
      $('#m-text').focus();
      toast('共有された文章をメモ欄に入れました。確認して「追加」を押してください');
      return;
    }
    const tel = get('tel');
    if (!/^\+?[\d\-]{10,15}$/.test(tel)) return;  // 電話番号の形でなければ何もしない
    $('nav.tabs button[data-tab="calls"]').click();
    $('#c-tel').value = tel;
    $('#c-need').checked = true;
    $('#c-who').focus();
    toast('着信履歴から番号を受け取りました。相手と用件を入れて登録してください');
  });
} catch (e) {}
</script>
